<script>
"use strict";
// ===========================================================================
// Modelo (port de model.cpp)
// ===========================================================================
const MO_SECONDS = 30;
const APP_VERSION = "2.2";
// Historial de versiones (misma numeración que la app de PC)
const CHANGELOG = [
  ["2.2","19/11/2026","PC: la app se adapta a la pantalla. Ventana inicial según la resolución; letras, botones y espacios escalan al redimensionar o maximizar, y con escala alta de Windows o al cambiar de monitor."],
  ["2.1","19/11/2026","Celular: la partida se guarda sola si cambiás de app o la cerrás, y al volver podés continuarla (el timer se pausa). Número de versión en el menú (PC y celular)."],
  ["2.0","19/11/2026","Versión para celular (Android y iPhone): instalable y sin internet. Suma pegar preguntas como texto, editar bloques y exportar una copia de seguridad."],
  ["1.3","19/11/2026","Porcentaje de preguntas por tema (y para todo el bloque) en \"Ver bloques cargados\". La app pasa a llamarse Q&A Study."],
  ["1.2","19/11/2026","Importar un bloque que ya existe agrega solo las preguntas nuevas y descarta las repetidas."],
  ["1.1","18/11/2026","Versión para Mac."],
  ["1.0","18/11/2026","Primera versión para Windows: Multiple Choice y Desarrollo, timer, importar preguntas, carga manual, bloques guardados y vista de bloques."],
];
const STORE_KEY = "qastudy.v1";
const GAME_KEY = "qastudy.partida.v1";

function trim(s){ return (s||"").replace(/^[\s\u0000- ]+|[\s\u0000- ]+$/g, ""); }
function foldChar(ch){
  const f = ch.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  if (f === "ø") return "o"; if (f === "æ") return "a"; if (f === "ß") return "s"; if (f === "đ") return "d"; if (f === "ł") return "l";
  return f;
}
function isWordStr(f){
  if (!f) return false;
  for (const c of f){ const cp = c.codePointAt(0);
    if (!((cp>=97&&cp<=122)||(cp>=48&&cp<=57)||cp>=0x370)) return false; }
  return true;
}
function normKey(s){ let o=""; for (const ch of s) o += foldChar(ch); return trim(o); }
function tokenize(s){
  const toks=[]; let norm="", orig="";
  for (const ch of s){
    const f = foldChar(ch);
    if (isWordStr(f)){ norm+=f; orig+=ch; }
    else { if (norm) toks.push({norm, orig}); norm=""; orig=""; }
  }
  if (norm) toks.push({norm, orig});
  return toks;
}
function normalizeForCompare(s){ return tokenize(s).map(t=>t.norm).join(" "); }

const STOP = new Set(("el la los las un una unos unas lo al del este esta estos estas ese esa esos esas aquel aquella aquellos aquellas esto eso aquello "+
"mi mis tu tus su sus nuestro nuestra nuestros nuestras vuestro vuestra otro otra otros otras cada todo toda todos todas algun alguno alguna algunos algunas "+
"ningun ninguno ninguna mismo misma mismos mismas tal tales cual cuales cuyo cuya mucho mucha muchos muchas poco poca pocos pocas varios varias tanto tanta tantos tantas "+
"a ante bajo cabe con contra de desde durante en entre hacia hasta mediante para por segun sin so sobre tras versus via "+
"y e ni o u pero sino mas aunque porque pues que si como cuando donde mientras ya tambien tampoco ademas entonces luego asi incluso sea bien embargo obstante "+
"decir cuanto cuanta cuantos cuantas quien quienes cuyos cuyas yo me conmigo te ti contigo ella ellos ellas le les se consigo "+
"nos nosotros nosotras os vosotros vosotras usted ustedes vos alguien nadie algo nada es son era eran fue fueron ser sera seran sido siendo sean "+
"estan estaba estaban estar estuvo estado ha han has he hemos haber habia habian hubo hay tiene tienen tener tenia puede pueden poder hace hacen hacer "+
"no muy menos solo solamente tan aqui ahi alli alla ahora siempre nunca casi bastante demasiado etc ej ejemplo vez veces").split(/\s+/));

function isKeyword(n){
  if (STOP.has(n)) return false;
  if (/^[0-9]+$/.test(n)) return true;
  return [...n].length >= 2;
}
function wordsMatch(a,b){
  if (a===b) return true;
  const s = a.length < b.length ? a : b, l = a.length < b.length ? b : a;
  if (s.length < 3) return false;
  if (l.length===s.length+1 && l.endsWith("s") && l.startsWith(s)) return true;
  if (l.length===s.length+2 && l.endsWith("es") && l.startsWith(s)) return true;
  if (l.length===s.length+2 && s.endsWith("z") && l.endsWith("ces") && l.startsWith(s.slice(0,-1))) return true;
  return false;
}
function computeMatch(answer, solution){
  const sol = tokenize(solution||""), ans = tokenize(answer||"");
  const keyNorm=[], keywords=[];
  for (const t of sol){
    if (!isKeyword(t.norm)) continue;
    if (keyNorm.some(k=>wordsMatch(k,t.norm))) continue;
    keyNorm.push(t.norm); keywords.push(t.orig);
  }
  const found = keyNorm.map(k => ans.some(a=>wordsMatch(k,a.norm)));
  const hits = found.filter(Boolean).length;
  const valid = keyNorm.length>0;
  return {keywords, found, valid, percent: valid ? 100*hits/keyNorm.length : 0};
}
function percentCount(n,pct){ if (n<=0) return 0; const k = Math.floor((n*pct+99)/100); return Math.max(1, Math.min(n,k)); }
function topicLabel(q){ return q.topic ? q.topic : "Sin tema"; }
function forMO(q){ return q.tag==="MO"||q.tag==="MOD"; }
function forDev(q){ return q.tag==="D"||q.tag==="MOD"; }

function classify(b){
  let n=1;
  for (const q of b.questions){
    q.number = n++; q.notes=[];
    q.topic=trim(q.topic); q.text=trim(q.text); q.correct=trim(q.correct); q.solution=trim(q.solution);
    const clean=[], seen=new Set(), corrKey=normKey(q.correct);
    for (const w of q.wrong){
      const t=trim(w); if (!t) continue;
      const k=normKey(t);
      if (corrKey && k===corrKey){ q.notes.push("Se quitó una respuesta falsa igual a la correcta."); continue; }
      if (seen.has(k)){ q.notes.push("Se quitó una respuesta falsa repetida."); continue; }
      seen.add(k); clean.push(t);
    }
    q.wrong=clean;
    const hasText=!!q.text, mo=hasText&&!!q.correct&&q.wrong.length>=2, dev=hasText&&!!q.solution;
    if (!hasText) q.notes.push("Falta el campo 3 (Pregunta).");
    if (hasText && q.wrong.length===0) q.notes.push("Campo 4 (Respuestas falsas) vacío: no es compatible con MO.");
    else if (hasText && q.wrong.length<2) q.notes.push("Tiene 1 respuesta falsa; MO necesita al menos 2.");
    if (hasText && !q.correct) q.notes.push("Campo 5 (Respuesta correcta) vacío: no es compatible con MO.");
    if (hasText && !q.solution) q.notes.push("Campo 6 (Solución) vacío: no es compatible con Desarrollo.");
    q.tag = mo&&dev ? "MOD" : mo ? "MO" : dev ? "D" : "E";
  }
}

function parseKey(line){
  const colon=line.indexOf(":");
  if (colon<0 || colon>40) return null;
  let k=normKey(line.slice(0,colon)).replace(/^[0-9.) ]+/,"");
  let key=null;
  if (["bloque","nombre del bloque","nombre"].includes(k)) key="block";
  else if (["tema","tema de la pregunta"].includes(k)) key="topic";
  else if (k==="pregunta") key="text";
  else if (["falsa","falsas","respuesta falsa","respuestas falsas","incorrecta"].includes(k)) key="wrong";
  else if (["correcta","respuesta correcta"].includes(k)) key="correct";
  else if (k==="solucion") key="solution";
  return key ? {key, value: trim(line.slice(colon+1))} : null;
}
function newQ(){ return {topic:"",text:"",wrong:[],correct:"",solution:"",tag:"E",notes:[],number:0}; }

function parseQuestions(text, fallbackName){
  const res={blocks:[], warnings:[]};
  let cur=newQ(), started=false, bi=-1, last=null, pendingBlank=0;
  // last: {obj, prop} para continuar el campo anterior
  const ensureBlock=()=>{ if (bi<0){ res.blocks.push(newBlock(fallbackName)); bi=res.blocks.length-1;
      res.warnings.push('El archivo no tiene línea BLOQUE:, se usó el nombre del archivo ("'+fallbackName+'").'); } };
  const finish=()=>{ if (started){ ensureBlock(); res.blocks[bi].questions.push(cur); } cur=newQ(); started=false; last=null; pendingBlank=0; };
  const lines=text.replace(/\r/g,"").split("\n");
  lines.forEach((line, i)=>{
    const lineNo=i+1, t=trim(line);
    if (t==="---"||t==="--"||t==="----"){ finish(); return; }
    const escaped=line.startsWith("\\");
    const pk = escaped ? null : parseKey(t);
    if (pk){
      const v=pk.value;
      switch (pk.key){
        case "block": {
          finish();
          const name = v || fallbackName;
          let f=res.blocks.findIndex(b=>b.name===name);
          if (f<0){ res.blocks.push(newBlock(name)); f=res.blocks.length-1; }
          bi=f; break;
        }
        case "topic":
          if (started && (cur.text||cur.topic||cur.correct||cur.wrong.length||cur.solution)) finish();
          cur.topic=v; started=true; last={o:cur,p:"topic"}; pendingBlank=0; break;
        case "text":
          if (started && cur.text) finish();
          cur.text=v; started=true; last={o:cur,p:"text"}; pendingBlank=0; break;
        case "wrong":
          cur.wrong.push(v); started=true; last={o:cur.wrong,p:cur.wrong.length-1}; pendingBlank=0; break;
        case "correct":
          if (cur.correct) res.warnings.push("Línea "+lineNo+": la pregunta tiene más de una respuesta correcta; se usa la última.");
          cur.correct=v; started=true; last={o:cur,p:"correct"}; pendingBlank=0; break;
        case "solution":
          cur.solution=v; started=true; last={o:cur,p:"solution"}; pendingBlank=0; break;
      }
      return;
    }
    const content = escaped ? line.slice(1) : line;
    if (!trim(content)){ if (last) pendingBlank++; return; }
    if (!last){ res.warnings.push("Línea "+lineNo+' ignorada (no tiene etiqueta): "'+t.slice(0,60)+'"'); return; }
    if (last.o[last.p]) last.o[last.p] += "\n" + "\n".repeat(pendingBlank);
    last.o[last.p] += trim(content);
    pendingBlank=0;
  });
  finish();
  res.blocks.forEach(classify);
  res.blocks = res.blocks.filter(b=>{ if (!b.questions.length) res.warnings.push('El bloque "'+b.name+'" no tiene preguntas y se ignoró.'); return b.questions.length>0; });
  return res;
}
function writeField(key, value){
  let out=key+": ";
  value.split("\n").forEach((line, i)=>{
    if (i>0){ const t=trim(line);
      if (parseKey(t) || t==="---"||t==="--"||t==="----" || line.startsWith("\\") || !t) out+="\\"; }
    out+=line+"\n";
  });
  return out;
}
function serializeBlocks(blocks){
  let out="";
  for (const b of blocks){
    out+="BLOQUE: "+b.name+"\n\n";
    for (const q of b.questions){
      if (q.topic) out+=writeField("TEMA",q.topic);
      out+=writeField("PREGUNTA",q.text);
      for (const w of q.wrong) out+=writeField("FALSA",w);
      if (q.correct) out+=writeField("CORRECTA",q.correct);
      if (q.solution) out+=writeField("SOLUCION",q.solution);
      out+="---\n";
    }
    out+="\n";
  }
  return out;
}
function newBlock(name){ return {name, questions:[], enabled:true, disabledTopics:[], topicPercent:{}}; }
function blockTopics(b){ const t=[]; for (const q of b.questions){ const l=topicLabel(q); if (!t.includes(l)) t.push(l); } return t; }
function topicEnabled(b,t){ return !b.disabledTopics.includes(t); }
function setTopicEnabled(b,t,on){ const i=b.disabledTopics.indexOf(t); if (on&&i>=0) b.disabledTopics.splice(i,1); if (!on&&i<0) b.disabledTopics.push(t); }
function topicPct(b,t){ return b.topicPercent[t] || 100; }
function setTopicPct(b,t,p){ p=Math.max(5,Math.min(100,p)); if (p===100) delete b.topicPercent[t]; else b.topicPercent[t]=p; }
function countTag(b,tag){ return b.questions.filter(q=>q.tag===tag).length; }
function countTopic(b,t,mo){ return b.questions.filter(q=>topicLabel(q)===t && (mo?forMO(q):forDev(q))).length; }

// Decodifica un archivo: BOM UTF-8/UTF-16, UTF-8 válido o ANSI (Windows-1252)
function decodeBytes(buf){
  const u=new Uint8Array(buf);
  let text;
  if (u.length>=3 && u[0]===0xEF&&u[1]===0xBB&&u[2]===0xBF) text=new TextDecoder("utf-8").decode(u.subarray(3));
  else if (u.length>=2 && u[0]===0xFF&&u[1]===0xFE) text=new TextDecoder("utf-16le").decode(u.subarray(2));
  else if (u.length>=2 && u[0]===0xFE&&u[1]===0xFF) text=new TextDecoder("utf-16be").decode(u.subarray(2));
  else { try { text=new TextDecoder("utf-8",{fatal:true}).decode(u); } catch(e){ text=new TextDecoder("windows-1252").decode(u); } }
  return text.replace(/\r/g,"");
}

// ===========================================================================
// Estado y guardado
// ===========================================================================
const S = {
  blocks: [], mode: "MO", timer: false,
  screen: "menu", play: [], idx: 0, qStart: 0,
  hiddenAt: null,  // momento en que la app quedó en segundo plano (pausa el tiempo)
  open: new Set(), // <details> abiertos en "Bloques"
  editor: null,    // {original, text}
};

function save(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      mode:S.mode, timer:S.timer,
      blocks:S.blocks.map(b=>({name:b.name, enabled:b.enabled, disabledTopics:b.disabledTopics, topicPercent:b.topicPercent,
        questions:b.questions.map(q=>({topic:q.topic,text:q.text,wrong:q.wrong,correct:q.correct,solution:q.solution}))}))
    }));
  } catch(e){ showMessage("No se pudieron guardar los datos", "El navegador no dejó guardar en el dispositivo ("+e.message+")."); }
}
function load(){
  try {
    const d=JSON.parse(localStorage.getItem(STORE_KEY)||"null");
    if (!d) return;
    S.mode = d.mode==="Dev" ? "Dev" : "MO";
    S.timer = !!d.timer;
    S.blocks = (d.blocks||[]).map(b=>{
      const nb=Object.assign(newBlock(b.name), {enabled:b.enabled!==false, disabledTopics:b.disabledTopics||[], topicPercent:b.topicPercent||{}});
      nb.questions=(b.questions||[]).map(q=>Object.assign(newQ(), q, {wrong:(q.wrong||[]).slice()}));
      classify(nb); return nb;
    });
  } catch(e){ console.error(e); }
}

// ===========================================================================
// Partida guardada (si se cambia de app o se cierra, se puede continuar)
// ===========================================================================
const GAME_SCREENS = ["mo","dev","moResults","devResults"];
function inGame(){ return GAME_SCREENS.includes(S.screen) && S.play.length>0; }
function saveGame(){
  if (!inGame()) return;
  try {
    localStorage.setItem(GAME_KEY, JSON.stringify({
      v:1, savedAt:Date.now(), mode:S.mode, timer:S.timer, screen:S.screen, idx:S.idx,
      elapsed: S.hiddenAt!=null ? S.hiddenAt-S.qStart : now()-S.qStart, // tiempo ya usado en la pregunta actual
      play:S.play
    }));
  } catch(e){ console.error(e); }
}
function clearGame(){ try { localStorage.removeItem(GAME_KEY); } catch(e){} }
function readGame(){
  try {
    const g=JSON.parse(localStorage.getItem(GAME_KEY)||"null");
    if (!g || g.v!==1 || !Array.isArray(g.play) || !g.play.length || !GAME_SCREENS.includes(g.screen)) return null;
    return g;
  } catch(e){ return null; }
}
function resumeGame(g){
  S.mode=g.mode==="Dev"?"Dev":"MO"; S.timer=!!g.timer; save();
  S.play=g.play; S.idx=Math.min(Math.max(0,g.idx|0), g.play.length-1);
  S.qStart=now()-Math.max(0, +g.elapsed||0); S.hiddenAt=null;
  go(g.screen);
  if (g.screen==="mo" && S.play[S.idx].answered) showActions();
}
function offerResume(){
  const g=readGame(); if (!g) return;
  const modo = g.mode==="Dev" ? "Desarrollo" : "Multiple Choice";
  const where = g.screen==="moResults"||g.screen==="devResults" ? "ya terminada (quedaron los resultados)" : "en la pregunta "+(g.idx+1)+" de "+g.play.length;
  const d=new Date(g.savedAt), cuando=d.toLocaleDateString("es-UY",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("es-UY",{hour:"2-digit",minute:"2-digit"});
  showModal(`<h3>Tenés una partida guardada</h3>
    <div>${esc(modo)}, ${esc(where)}.</div><div class="muted small" style="margin-top:4px">Guardada el ${esc(cuando)}</div>
    <div class="row"><button class="btn" data-m="no">Descartar</button><button class="btn accent" data-m="yes">Continuar</button></div>`,
    {no:()=>{ clearGame(); closeModal(); }, yes:()=>{ closeModal(); resumeGame(g); }});
}
// Al salir de la app el tiempo se pausa y la partida se guarda
document.addEventListener("visibilitychange", ()=>{
  if (document.hidden){ if (S.hiddenAt==null) S.hiddenAt=now(); saveGame(); }
  else if (S.hiddenAt!=null){ S.qStart+=now()-S.hiddenAt; S.hiddenAt=null; tick(); }
});

// ===========================================================================
// Utilidades
// ===========================================================================
const $ = sel => document.querySelector(sel);
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function now(){ return performance.now()/1000; }
function fmtTime(s, tenths){
  if (s<0) s=0; const tot=Math.floor(s), h=Math.floor(tot/3600), m=Math.floor(tot/60)%60, sec=tot%60;
  const p=n=>String(n).padStart(2,"0");
  if (h>0) return h+":"+p(m)+":"+p(sec);
  if (tenths) return p(m)+":"+p(sec)+"."+Math.floor((s-tot)*10);
  return p(m)+":"+p(sec);
}
function pctClass(p){ return p>=70 ? "ok" : p>=40 ? "warn" : "bad"; }
function tagColor(t){ return t==="MOD"?"var(--green)":t==="MO"?"var(--accent)":t==="D"?"var(--blue)":"var(--red)"; }
function chip(text,color){ return '<span class="chip" style="color:'+color+'">'+esc(text)+'</span>'; }
function compatText(t){ return {MOD:"Compatible con MO y Desarrollo", MO:"Compatible solo con MO", D:"Compatible solo con Desarrollo"}[t] || "Error: no se puede usar en ningún modo"; }
function field(label, value, cls){
  return '<div class="label">'+esc(label)+'</div><div class="pre '+(cls||"")+'">'+(value ? esc(value) : '<span class="muted">(vacío)</span>')+'</div>';
}
function plural(n, s, p){ return n===1 ? s : p; }

// ===========================================================================
// Partidas
// ===========================================================================
function collectQuestions(mode){
  const out=[], mo = mode==="MO";
  for (const b of S.blocks){
    if (!b.enabled) continue;
    for (const tp of blockTopics(b)){
      if (!topicEnabled(b,tp)) continue;
      let pool=b.questions.filter(q=>topicLabel(q)===tp && (mo?forMO(q):forDev(q)));
      const take=percentCount(pool.length, topicPct(b,tp));
      if (take<pool.length){ shuffle(pool); pool=pool.slice(0,take); }
      for (const q of pool) out.push({block:b.name, q});
    }
  }
  return out;
}
function countAvailable(mode){
  let n=0;
  for (const b of S.blocks) if (b.enabled) for (const tp of blockTopics(b)) if (topicEnabled(b,tp)) n+=percentCount(countTopic(b,tp,mode==="MO"), topicPct(b,tp));
  return n;
}
function startGame(list){
  if (!list.length) return;
  S.play = shuffle(list.map(p=>{
    const f={block:p.block, q:p.q, options:[], correctIdx:-1, chosen:-1, timedOut:false, answered:false, revealed:false, answer:"", submitted:false, seconds:0, match:null};
    if (S.mode==="MO"){
      const wrong=shuffle(p.q.wrong.slice()).slice(0,3);
      f.options=shuffle(wrong.concat([p.q.correct]));
      f.correctIdx=f.options.indexOf(p.q.correct);
    }
    return f;
  }));
  S.idx=0;
  go(S.mode==="MO" ? "mo" : "dev");
  startQuestion();
}
function startQuestion(){ S.qStart=now(); render(); window.scrollTo(0,0);
  if (S.screen==="dev"){ const ta=$("#answer"); if (ta) setTimeout(()=>ta.focus(), 50); } }

// Navegación (botón atrás de Android)

function go(screen){
  const wasMenu = S.screen==="menu";
  S.screen=screen;
  if (wasMenu && screen!=="menu") history.pushState({app:1}, "");
  render();
  window.scrollTo(0,0);
}
function goMenu(){
  S.play=[]; S.idx=0; clearGame();
  const was=S.screen; S.screen="menu"; render(); window.scrollTo(0,0);
  if (was!=="menu" && history.state && history.state.app) { ignorePop=true; history.back(); }
}
let ignorePop=false;
window.addEventListener("popstate", ()=>{
  if (ignorePop){ ignorePop=false; return; }
  if (S.screen==="menu") return;
  if (S.screen==="mo"||S.screen==="dev"){ history.pushState({app:1}, ""); confirmLeave(); return; }
  if (S.screen==="editor" && S.editor && S.editor.dirty){ history.pushState({app:1}, ""); confirmLeaveEditor(); return; }
  if (inGame()) clearGame();
  S.play=[]; S.screen="menu"; closeModal(); render();
});

function renderBlocks(){
  const mo=S.mode==="MO", modeName=mo?"MO":"Desarrollo";
  let h=`
  <div class="topbar"><button class="sbtn" data-act="menu">‹ Menú</button><button class="sbtn" data-act="import">Importar</button></div>
  <h2>Bloques cargados</h2>
  <div class="muted small">Tocá un bloque para ver sus temas y preguntas. Solo entran en la partida los bloques y temas tildados,

  if (!S.blocks.length) h+=`<div class="empty muted">Todavía no hay bloques. Usá "Importar" o "Escribir o pegar preguntas" desde el menú.</div>`;
  S.blocks.forEach((b,bi)=>{
    const topics=blockTopics(b);
    const key="b"+bi;
    h+=`<details data-key="${key}" ${S.open.has(key)?"open":""}>
      <summary><span class="arrow"></span><span class="bname" style="${b.enabled?"":"color:var(--muted)"}">${esc(b.name)}</span>
        <span class="muted small" style="white-space:nowrap">${b.questions.length} preg.</span></summary>
      <div class="bbody">
        <div class="blockctl">
          <label class="check" style="flex:1"><input type="checkbox" data-inc="${bi}" ${b.enabled?"checked":""}> Incluir en las partidas</label>

        </div>
        <div>${["MOD","MO","D","E"].map(t=>chip(t+"  "+countTag(b,t), tagColor(t))).join("")}</div>`;
    if (topics.length){
      const common=topicPct(b,topics[0]), mixed=topics.some(t=>topicPct(b,t)!==common);
      h+=`<div class="allpct"><div class="small">Porcentaje para todos los temas · <span class="muted" id="info-${bi}">${blockInfo(b)}</span></div>
        <div class="pctrow"><input type="range" min="5" max="100" step="5" value="${common}" data-all="${bi}">
        <span class="pv" id="allv-${bi}">${mixed?"varía":common+"%"}</span></div></div>`;
    }
    topics.forEach((tp,ti)=>{
      const cnt=b.questions.filter(q=>topicLabel(q)===tp).length, on=topicEnabled(b,tp), pct=topicPct(b,tp);
      h+=`<div class="topic">
        <label class="check"><input type="checkbox" data-tp="${bi}:${ti}" ${on?"checked":""}>
          <span><span class="tname">${esc(tp)}</span> <span class="muted small">(${cnt} ${plural(cnt,"pregunta","preguntas")})</span></span></label>
        <div class="pctrow ${on?"":"off"}" id="row-${bi}-${ti}"><input type="range" min="5" max="100" step="5" value="${pct}" data-pct="${bi}:${ti}" ${on?"":"disabled"}>
          <span class="pv" id="pv-${bi}-${ti}">${pct}%</span></div>
        <div class="muted small" style="margin-left:32px" id="ti-${bi}-${ti}">${topicInfo(b,tp)}</div>`;
      b.questions.forEach((q,qi)=>{
        if (topicLabel(q)!==tp) return;
        const qk=key+"q"+qi;
        h+=`<details class="qitem" data-key="${qk}" ${S.open.has(qk)?"open":""}><summary>${chip(q.tag,tagColor(q.tag))}<span class="muted">#${q.number}</span>
          <span class="qprev">${esc((q.text||"(sin pregunta)").split("\n")[0])}</span></summary>
          <div class="qdet">${S.open.has(qk)?questionDetail(q):""}</div></details>`;
      });
      h+=`</div>`;
    });
    h+=`</div></details>`;
  });
  return h;
}
function questionDetail(q){
  return field("Compatibilidad", compatText(q.tag), q.tag==="E"?"bad":q.tag==="MOD"?"ok":"") +
    (q.topic?field("Tema",q.topic):"") + field("Pregunta",q.text) +
    field("Respuestas falsas", q.wrong.map(w=>"- "+w).join("\n"), "bad") +
    field("Respuesta correcta", q.correct, "ok") + field("Solución", q.solution) +
    (q.notes.length?field("Avisos", q.notes.join("\n"), "warn"):"");
}
function topicInfo(b,tp){
  const mo=S.mode==="MO", n=countTopic(b,tp,mo);
  return n===0 ? "sin preguntas de "+(mo?"MO":"Desarrollo") : "se juegan "+percentCount(n,topicPct(b,tp))+" de "+n;
}
function blockInfo(b){
  const mo=S.mode==="MO"; let play=0, avail=0;
  for (const tp of blockTopics(b)){ if (!topicEnabled(b,tp)) continue; const n=countTopic(b,tp,mo); avail+=n; play+=percentCount(n,topicPct(b,tp)); }
  return "se juegan "+play+" de "+avail;
}
function bindBlocks(){
  document.querySelectorAll("details[data-key]").forEach(d=>d.addEventListener("toggle", ()=>{
    const k=d.dataset.key;
    if (d.open){ S.open.add(k);
      if (d.classList.contains("qitem")){ const m=k.match(/^b(\d+)q(\d+)$/); const det=d.querySelector(".qdet");
        if (m && det && !det.innerHTML) det.innerHTML=questionDetail(S.blocks[+m[1]].questions[+m[2]]); } }
    else S.open.delete(k);
  }));
}
function refreshBlockNumbers(bi){
  const b=S.blocks[bi], topics=blockTopics(b);
  const inf=$("#info-"+bi); if (inf) inf.textContent=blockInfo(b);
  topics.forEach((tp,ti)=>{
    const on=topicEnabled(b,tp), pct=topicPct(b,tp);
    const r=$("#row-"+bi+"-"+ti), pv=$("#pv-"+bi+"-"+ti), t=$("#ti-"+bi+"-"+ti);
    if (r){ r.classList.toggle("off",!on); const inp=r.querySelector("input"); inp.disabled=!on; if (document.activeElement!==inp) inp.value=pct; }
    if (pv) pv.textContent=pct+"%";
    if (t) t.textContent=topicInfo(b,tp);
  });
  const av=$("#allv-"+bi);
  if (av && topics.length){ const c=topicPct(b,topics[0]); av.textContent=topics.some(t=>topicPct(b,t)!==c)?"varía":c+"%"; }
}

function renderMO(){

  <div class="qtext pre">${esc(p.q.text)}</div>`;
  p.options.forEach((o,i)=>{
    let st=0;

  });
  if (p.answered){
    const canReveal=!ok && !p.revealed && !p.timedOut;
    h+=`<div class="verdict ${ok?"ok":"bad"}">${ok?"¡Correcto!":p.timedOut?"Se acabó el tiempo":"Incorrecto"}</div>

function showActions(){ const b=document.querySelector('[data-act="next"],[data-act="devNext"]'); if (b) b.scrollIntoView({block:"end", behavior:"smooth"}); }
function renderMOResults(){
  const n=S.play.length, good=p=>!p.timedOut && p.chosen===p.correctIdx;

  const order=S.play.filter(p=>!good(p)).concat(S.play.filter(good));
  for (const p of order){

function renderDevResults(){
  let sum=0,cnt=0,total=0;
  for (const p of S.play){ if (p.match.valid){ sum+=p.match.percent; cnt++; } total+=p.seconds; }
  const avg=cnt?sum/cnt:0;
  let h=`<h2 style="margin-top:16px">Resultados</h2><div class="stats">
    <div class="card"><div class="stat ${pctClass(avg)}">${Math.round(avg)}%</div><div class="muted small">Promedio de coincidencia</div></div>
    ${S.timer?`<div class="card"><div class="stat">${fmtTime(total,false)}</div><div class="muted small">Tiempo total de la ronda</div></div>`:""}</div>`;
  S.play.forEach((p,i)=>{
    const m=p.match, hit=m.found.filter(Boolean).length;
    h+=`<div class="card">
      <div class="row" style="align-items:flex-start"><div class="muted small" style="flex:1">Pregunta ${i+1}  ·  ${esc(p.block+(p.q.topic?"  ·  "+p.q.topic:""))}</div>
        <div style="font-size:24px;font-weight:700" class="${m.valid?pctClass(m.percent):"muted"}">${m.valid?Math.round(m.percent)+"%":"--"}</div></div>
      <div class="pre" style="font-weight:700;font-size:18px;margin-top:4px">${esc(p.q.text)}</div>
      ${S.timer?`<div class="muted small">Tiempo: ${fmtTime(p.seconds,true)}</div>`:""}
      ${field("Tu respuesta", p.answer||"(sin respuesta)", p.answer?"":"muted")}
      ${field("Solución", p.q.solution)}
      <div class="label">Palabras clave (${hit} de ${m.keywords.length})</div>
      <div>${m.keywords.length ? m.keywords.map((k,j)=>`<span class="kw ${m.found[j]?"ok":"muted"}">${esc(k)}</span>`).join("") : '<span class="muted">(la solución no tiene palabras clave)</span>'}</div>
    </div>`;
  });
  h+=`<div class="row"><button class="btn" data-act="menu">Volver al menú</button><button class="btn accent" data-act="again">Intentar de nuevo</button></div>`;
  return h;
}

// ===========================================================================
// Timer
// ===========================================================================
function tick(){
  if (!S.timer || S.hiddenAt!=null) return;
  if (S.screen==="mo"){
    const p=S.play[S.idx]; if (!p) return;
    const el=now()-S.qStart;
    if (!p.answered && el>=MO_SECONDS){ p.answered=true; p.timedOut=true; p.chosen=-1; p.seconds=MO_SECONDS; render(); showActions(); return; }
    const left = p.answered ? (p.timedOut ? 0 : Math.max(0, MO_SECONDS-p.seconds)) : Math.max(0, MO_SECONDS-el);
    const tl=$("#tleft"), tb=$("#tbar");
    const c = left<=5 ? "var(--red)" : left<=10 ? "var(--yellow)" : "var(--green)";
    if (tl){ tl.textContent=Math.ceil(left)+" s"; tl.style.color = left<=5 ? "var(--red)" : left<=10 ? "var(--yellow)" : "var(--text)"; }
    if (tb){ tb.style.width=(100*left/MO_SECONDS)+"%"; tb.style.background=c; }
  } else if (S.screen==="dev"){
    const p=S.play[S.idx]; if (!p) return;
    const t = p.submitted ? p.seconds : now()-S.qStart;
    let total=t; for (let i=0;i<S.idx;i++) total+=S.play[i].seconds;
    const a=$("#tq"), b=$("#ttot");
    if (a) a.textContent=fmtTime(t,true);
    if (b) b.textContent="total de la ronda "+fmtTime(total,false);
  }
}
setInterval(tick, 100);

// ===========================================================================
// Importar
// ===========================================================================
function addImportedBlock(b, summary){
  const ex=S.blocks.find(e=>e.name===b.name);
  if (!ex){
    S.blocks.push(b);
    summary.push([1, `${b.name}: bloque nuevo con ${b.questions.length} preguntas (MOD ${countTag(b,"MOD")} · MO ${countTag(b,"MO")} · D ${countTag(b,"D")} · E ${countTag(b,"E")})`]);
    if (countTag(b,"E")>0) summary.push([2, b.name+': hay preguntas con error (E). Podés ver el motivo en "Ver bloques cargados".']);
    return;
  }
  const seen=new Set(ex.questions.map(q=>normalizeForCompare(q.text)));
  let added=0, dup=0, errs=0;
  for (const q of b.questions){
    const k=normalizeForCompare(q.text);
    if (seen.has(k)){ dup++; continue; }
    seen.add(k); ex.questions.push(q); added++; if (q.tag==="E") errs++;
  }
  classify(ex);
  summary.push([added>0?1:2, `${b.name}: ya existía. Se agregaron ${added} ${plural(added,"pregunta nueva","preguntas nuevas")} y se descartaron ${dup} ${plural(dup,"repetida","repetidas")}.`]);
  if (errs>0) summary.push([2, b.name+': hay preguntas nuevas con error (E). Podés ver el motivo en "Ver bloques cargados".']);
}
function importTexts(items){ // [{name, text}]
  const summary=[];
  for (const it of items){
    const r=parseQuestions(it.text, it.name);
    for (const w of r.warnings) summary.push([2, it.name+": "+w]);
    if (!r.blocks.length){ summary.push([3, it.name+": no se encontraron preguntas."]); continue; }
    for (const b of r.blocks) addImportedBlock(b, summary);
  }
  save();
  showSummary(summary);
  return summary.some(s=>s[0]===1);
}
$("#file").addEventListener("change", async e=>{
  const files=[...e.target.files]; e.target.value="";
  const items=[];
  for (const f of files){
    try { items.push({name:f.name.replace(/\.[^.]+$/,""), text:decodeBytes(await f.arrayBuffer())}); }
    catch(err){ items.push({name:f.name, text:""}); }
  }
  if (items.length){ importTexts(items); render(); }
});

function exportBackup(){
  const blob=new Blob(["﻿"+serializeBlocks(S.blocks)], {type:"text/plain;charset=utf-8"});
  const d=new Date(), name="QA-Study-copia-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".txt";
  const file=new File([blob], name, {type:"text/plain"});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name}).catch(()=>{});
  } else {
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
}

// ===========================================================================
// Modales
// ===========================================================================
let modalActions={};
function showModal(html, actions){ modalActions=actions||{}; $("#modal").innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`; }
function closeModal(){ $("#modal").innerHTML=""; modalActions={}; }
function showMessage(title, text){ showModal(`<h3>${esc(title)}</h3><div class="pre">${esc(text)}</div><button class="btn accent" data-m="ok">Aceptar</button>`, {ok:closeModal}); }
function showSummary(summary){
  const any=summary.some(s=>s[0]===1);
  const cls={1:"ok",2:"warn",3:"bad"};
  showModal(`<h3>${any?"Carga exitosa":"No se agregaron preguntas nuevas"}</h3>
    ${summary.map(s=>`<div class="sumline ${cls[s[0]]||""}">${esc(s[1])}</div>`).join("")}
    <div class="row"><button class="btn" data-m="blocks" ${any?"":"disabled"}>Ver bloques</button><button class="btn accent" data-m="ok">Aceptar</button></div>`,
    {ok:closeModal, blocks:()=>{ closeModal(); go("blocks"); }});
}
function confirmLeave(){
  showModal(`<h3>¿Volver al menú?</h3><div class="muted">Se pierde el progreso de esta ronda.</div>
    <div class="row"><button class="btn" data-m="stay">Seguir jugando</button><button class="btn accent" data-m="leave">Volver al menú</button></div>`,
    {stay:closeModal, leave:()=>{ closeModal(); goMenu(); }});
}
function confirmLeaveEditor(){
  showModal(`<h3>¿Descartar los cambios?</h3><div class="muted">Lo que escribiste no se guardó.</div>
    <div class="row"><button class="btn" data-m="stay">Seguir editando</button><button class="btn accent" data-m="leave">Descartar</button></div>`,
    {stay:closeModal, leave:()=>{ closeModal(); S.editor=null; goMenu(); }});
}

// ===========================================================================
// Eventos
// ===========================================================================
document.addEventListener("click", e=>{
  const m=e.target.closest("[data-m]");
  if (m){ const f=modalActions[m.dataset.m]; if (f) f(); return; }
  const el=e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act=el.dataset.act;
  switch (act){
    case "mode": S.mode=el.dataset.v; save(); render(); break;
    case "timer": S.timer=!S.timer; save(); render(); break;
    case "start": startGame(collectQuestions(S.mode)); break;
    case "import": $("#file").click(); break;
    case "newblock": openEditor(null); break;
    case "blocks": go("blocks"); break;
    case "export": exportBackup(); break;
    case "changelog":
      showModal(`<h3>Q&amp;A Study v${APP_VERSION}</h3>${CHANGELOG.map(c=>`<div class="cl-item"><span class="cl-v">v${c[0]}</span> <span class="muted small">${c[1]}</span><div class="small">${esc(c[2])}</div></div>`).join("")}
        <button class="btn accent" data-m="ok">Cerrar</button>`, {ok:closeModal});
      break;
    case "menu": goMenu(); break;
    case "leave": confirmLeave(); break;
    case "edit": openEditor(+el.dataset.b); break;
    case "del": {
      const bi=+el.dataset.b, nm=S.blocks[bi].name;
      showModal(`<h3>¿Borrar el bloque?</h3><div>Se va a borrar "${esc(nm)}" con todas sus preguntas. No se puede deshacer.</div>
        <div class="row"><button class="btn" data-m="no">Cancelar</button><button class="btn accent" data-m="yes" style="background:var(--red);border-color:var(--red)">Borrar</button></div>`,
        {no:closeModal, yes:()=>{ S.blocks.splice(bi,1); S.open.clear(); save(); closeModal(); render(); }});
      break;
    }
    case "opt": {
      const p=S.play[S.idx]; if (p.answered) break;
      p.chosen=+el.dataset.i; p.answered=true; p.seconds=now()-S.qStart; render(); showActions(); break;
    }
    case "reveal": S.play[S.idx].revealed=true; render(); showActions(); break;
    case "next":
      if (S.idx+1>=S.play.length){ S.screen="moResults"; render(); window.scrollTo(0,0); }
      else { S.idx++; startQuestion(); }
      break;
    case "again": startGame(collectQuestions(S.mode)); break;
    case "failed": startGame(S.play.filter(p=>p.timedOut||p.chosen!==p.correctIdx)); break;
    case "submit": {
      const p=S.play[S.idx]; p.submitted=true; p.seconds=now()-S.qStart; p.answer=p.answer.replace(/[\n ]+$/,""); render(); showActions(); break;
    }
    case "devNext":
      if (S.idx+1>=S.play.length){ for (const p of S.play) p.match=computeMatch(p.answer, p.q.solution); S.screen="devResults"; render(); window.scrollTo(0,0); }
      else { S.idx++; startQuestion(); }
      break;
    case "template": {
      const t=$("#edtext"); t.value = (t.value && !t.value.endsWith("\n") ? t.value+"\n" : t.value) + (t.value.trim() ? EDITOR_TEMPLATE.replace(/^BLOQUE:.*\n\n/,"") : EDITOR_TEMPLATE);
      S.editor.text=t.value; S.editor.dirty=true; t.focus(); break;
    }
    case "editorBack": if (S.editor.dirty) confirmLeaveEditor(); else goMenu(); break;
    case "editorSave": editorSave(); break;
  }
});
function editorSave(){
  const ed=S.editor, text=ed.text;
  if (!trim(text)){ showMessage("No hay preguntas", "Escribí o pegá al menos una pregunta."); return; }
  if (ed.original==null){
    const ok=importTexts([{name:"Sin nombre", text}]);
    if (ok){ S.editor=null; S.screen="blocks"; render(); }
    return;
  }
  const r=parseQuestions(text, ed.original);
  if (r.blocks.length!==1){ showMessage("Revisá el texto", r.blocks.length ? "El texto tiene más de un BLOQUE:. Al editar, dejá uno solo." : "No se encontraron preguntas."); return; }
  const nb=r.blocks[0], i=S.blocks.findIndex(b=>b.name===ed.original), old=S.blocks[i];
  if (nb.name!==ed.original && S.blocks.some(b=>b.name===nb.name)){ showMessage("Ese nombre ya existe", 'Ya hay otro bloque llamado "'+nb.name+'". Cambiá el nombre.'); return; }
  nb.enabled=old.enabled; nb.disabledTopics=old.disabledTopics; nb.topicPercent=old.topicPercent;
  S.blocks[i]=nb; save(); S.open.clear(); S.editor=null; S.screen="blocks"; render();
  if (r.warnings.length) showMessage("Bloque guardado con avisos", r.warnings.join("\n"));
}
document.addEventListener("change", e=>{
  const t=e.target;
  if (t.dataset.inc!=null){ const b=S.blocks[+t.dataset.inc]; b.enabled=t.checked;
    const nm=t.closest("details").querySelector(".bname"); if (nm) nm.style.color=b.enabled?"":"var(--muted)"; save(); }
  else if (t.dataset.tp!=null){ const [bi,ti]=t.dataset.tp.split(":").map(Number), b=S.blocks[bi]; setTopicEnabled(b, blockTopics(b)[ti], t.checked); refreshBlockNumbers(bi); save(); }
  else if (t.dataset.pct!=null || t.dataset.all!=null) save();
});
document.addEventListener("input", e=>{
  const t=e.target;
  if (t.dataset.pct!=null){ const [bi,ti]=t.dataset.pct.split(":").map(Number), b=S.blocks[bi]; setTopicPct(b, blockTopics(b)[ti], +t.value); refreshBlockNumbers(bi); }
  else if (t.dataset.all!=null){ const bi=+t.dataset.all, b=S.blocks[bi];
    for (const tp of blockTopics(b)) setTopicPct(b,tp,+t.value);
    document.querySelectorAll(`[data-pct^="${bi}:"]`).forEach(x=>x.value=t.value);
    refreshBlockNumbers(bi); }
});
// Atajos con teclado físico (opcional)
document.addEventListener("keydown", e=>{
  if ($("#modal").innerHTML) return;
  if (S.screen==="mo"){
    const p=S.play[S.idx];
    if (!p.answered){ const k="1234".indexOf(e.key)>=0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
      if (k>=0 && k<p.options.length && e.key.length===1){ p.chosen=k; p.answered=true; p.seconds=now()-S.qStart; render(); } }
    else if (e.key==="Enter"){ const b=document.querySelector('[data-act="next"]'); if (b) b.click(); }
    else if (e.key.toLowerCase()==="r"){ const b=document.querySelector('[data-act="reveal"]'); if (b) b.click(); }
  } else if (S.screen==="dev" && e.key==="Enter"){
    const p=S.play[S.idx];
    if (!p.submitted && (e.ctrlKey||e.metaKey)){ e.preventDefault(); document.querySelector('[data-act="submit"]').click(); }
    else if (p.submitted){ e.preventDefault(); document.querySelector('[data-act="devNext"]').click(); }
  }
});
